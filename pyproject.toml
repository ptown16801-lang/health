[build-system]
requires = ["setuptools>=66"]
build-backend = "setuptools.build_meta"

[project]
name = "health-ingest"
version = "0.1.0"
description = "Local-first medical record ingestion tools"
requires-python = ">=3.11"

[project.scripts]
health-ingest = "health_ingest.cli:main"

[tool.setuptools.packages.find]
include = ["health_ingest*"]
